name: Crypto strategy scan wave 2

on:
  workflow_dispatch:
  push:
    paths:
      - 'wave2.py'
      - 'backtest.py'
      - 'run_fixed.py'
      - 'requirements.txt'
      - '.github/workflows/wave2.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache Binance archives
        uses: actions/cache@v4
        with:
          path: .cache
          key: binance-hourly-2023-2026-07-v1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run wave 2 scan
        run: python wave2.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave2
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update wave 2 results [skip ci]"
            git push
          fi
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-strategy-wave2-results
          path: results_wave2/
          if-no-files-found: error
          retention-days: 30
