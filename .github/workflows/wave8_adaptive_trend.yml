name: Wave 8 AdaptiveTrend replication

on:
  push:
    branches: [main]
    paths:
      - 'wave8_adaptive_trend.py'
      - '.github/workflows/wave8_adaptive_trend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache_wave8
          key: wave8-crypto-6h-v1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run wave 8
        run: python wave8_adaptive_trend.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave8
          git diff --cached --quiet || git commit -m "Add AdaptiveTrend replication results"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: wave8-adaptive-trend-results
          path: results_wave8
