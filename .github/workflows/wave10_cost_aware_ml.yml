name: Wave 10 cost-aware BTC ML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wave10_cost_aware_ml.py'
      - '.github/workflows/wave10_cost_aware_ml.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache_wave10
          key: wave10-btc-perp-2020-2026-v1
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'scikit-learn>=1.5,<2' 'xgboost>=3.0,<4'
      - name: Run cost-aware ML replication
        run: python wave10_cost_aware_ml.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave10
          git diff --cached --quiet || git commit -m "Add wave 10 cost-aware ML results [skip ci]"
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: wave10-cost-aware-ml-results
          path: results_wave10
