name: Microstructure crypto research

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'microstructure_research.py'
      - '.github/workflows/microstructure_research.yml'

permissions:
  contents: write

concurrency:
  group: microstructure-crypto-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache_microstructure
          key: microstructure-2023-2026-${{ runner.os }}-v1
          restore-keys: |
            microstructure-2023-2026-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run microstructure research batch
        id: research
        continue-on-error: true
        run: python microstructure_research.py
      - name: Commit research results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_microstructure || true
          git diff --cached --quiet || git commit -m "Microstructure research batch [skip ci]"
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microstructure-research-latest
          path: results_microstructure
          if-no-files-found: ignore
          retention-days: 14
      - name: Propagate research failure
        if: steps.research.outcome == 'failure'
        run: exit 1
