name: Exact live stock portfolio wave 4D

on:
  workflow_dispatch:
  push:
    paths:
      - 'wave4d_exact_live.py'
      - 'wave4c_live_signal.py'
      - 'requirements.txt'
      - '.github/workflows/wave4d_exact_live.yml'

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate exact portfolio state
        run: python wave4d_exact_live.py
      - name: Commit portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave4d
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update exact live portfolio state [skip ci]"
            git push
          fi
      - name: Upload portfolio artifact
        uses: actions/upload-artifact@v4
        with:
          name: exact-live-stock-portfolio
          path: results_wave4d/
          if-no-files-found: error
          retention-days: 7
