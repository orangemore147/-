name: Crypto strategy backtest fixed

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest.py'
      - 'run_fixed.py'
      - 'requirements.txt'
      - '.github/workflows/backtest_fixed.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run corrected backtest
        run: python run_fixed.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Update backtest results [skip ci]"
            git push
          fi
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-backtest-results-fixed
          path: results/
          if-no-files-found: error
          retention-days: 30
