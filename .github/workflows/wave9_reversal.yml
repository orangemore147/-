name: Wave 9 cross-sectional reversal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wave9_cross_sectional_reversal.py'
      - '.github/workflows/wave9_reversal.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache_wave3
          key: binance-funding-spot-perp-2023-2026-07-v1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run reversal scan
        run: python wave9_cross_sectional_reversal.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave9
          git diff --cached --quiet || git commit -m "Add wave 9 reversal results [skip ci]"
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: wave9-reversal-results
          path: results_wave9
