name: Fast stock 2 percent audit

on:
  push:
    branches: [main]
    paths:
      - 'wave6_stock_fast.py'
      - '.github/workflows/wave6_stock_fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache_wave6_stock_adjusted
          key: wave6-stock-adjusted-v1
      - run: python -m pip install -r requirements.txt
      - run: python wave6_stock_fast.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave6_stock_fast
          git diff --cached --quiet || git commit -m "Add fast stock 2 percent audit results"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: wave6-stock-fast-results
          path: results_wave6_stock_fast
