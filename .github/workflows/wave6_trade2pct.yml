name: Trade-level 2 percent strategy audit

on:
  push:
    branches: [main]
    paths:
      - 'wave6_trade_level_2pct.py'
      - '.github/workflows/wave6_trade2pct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .cache_wave5
            .cache_wave6_crypto
          key: wave6-data-v1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run audit
        run: python wave6_trade_level_2pct.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave6
          git diff --cached --quiet || git commit -m "Add wave 6 trade-level audit results"
          git push
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: wave6-trade2pct-results
          path: results_wave6
