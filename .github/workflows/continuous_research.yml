name: Continuous crypto research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'continuous_research_v2.py'
      - '.github/workflows/continuous_research.yml'

permissions:
  contents: write

concurrency:
  group: continuous-crypto-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: .cache_continuous_v2
          key: continuous-crypto-v2-2023-2026-${{ runner.os }}-v1
          restore-keys: |
            continuous-crypto-v2-2023-2026-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run leakage-resistant research batch
        id: research
        continue-on-error: true
        run: python continuous_research_v2.py

      - name: Commit research status and results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_continuous_v2 || true
          git diff --cached --quiet || git commit -m "Continuous research v2 batch [skip ci]"
          git pull --rebase origin main
          git push

      - name: Upload latest research files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-research-v2-latest
          path: results_continuous_v2
          if-no-files-found: ignore
          retention-days: 14

      - name: Propagate research failure
        if: steps.research.outcome == 'failure'
        run: exit 1
