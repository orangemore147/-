name: Academic strategy scan wave 5

on:
  push:
    paths:
      - wave5_academic_strategies.py
      - .github/workflows/wave5_academic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy requests tabulate
      - name: Run academic strategy scan
        run: python wave5_academic_strategies.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add results_wave5
          git commit -m "Update wave 5 academic strategy results" || exit 0
          git push
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: wave5-academic-results
          path: results_wave5
