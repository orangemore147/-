name: Frozen robustness audit

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    branches: [main]
    paths:
      - 'robustness_audit.py'
      - '.github/workflows/robustness_audit.yml'
      - 'results_continuous_v2/dev_leaderboard.csv'

permissions:
  contents: write

concurrency:
  group: frozen-robustness-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache_robust_audit
          key: robust-audit-2023-2026-${{ runner.os }}-v1
          restore-keys: |
            robust-audit-2023-2026-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run frozen robustness audit
        id: audit
        continue-on-error: true
        run: python robustness_audit.py
      - name: Commit audit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_robust_audit || true
          git diff --cached --quiet || git commit -m "Frozen robustness audit [skip ci]"
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robust-audit-latest
          path: results_robust_audit
          if-no-files-found: ignore
          retention-days: 14
      - name: Propagate audit failure
        if: steps.audit.outcome == 'failure'
        run: exit 1
