name: Wave 12 squeeze external confirmation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wave12_squeeze_external_confirmation.py'
      - '.github/workflows/wave12_squeeze_confirmation.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache_wave12
          key: wave12-new-universe-2023-2026-v1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run external confirmation
        run: python wave12_squeeze_external_confirmation.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave12
          git diff --cached --quiet || git commit -m "Add wave 12 external confirmation results [skip ci]"
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: wave12-squeeze-confirmation-results
          path: results_wave12
