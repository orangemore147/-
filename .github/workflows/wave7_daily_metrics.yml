name: Wave 7 daily OI derivatives edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wave7_daily_metrics_runner.py'
      - '.github/workflows/wave7_daily_metrics.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .cache_wave3
            .cache_wave7_metrics_daily
          key: wave7-daily-metrics-v1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run wave 7 daily metrics audit
        run: python wave7_daily_metrics_runner.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_wave7_daily
          git diff --cached --quiet || git commit -m "Add wave 7 daily OI results [skip ci]"
          git push
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: wave7-daily-oi-results
          path: results_wave7_daily
